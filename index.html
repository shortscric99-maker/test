<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Uploader</title>
<style>
:root{--bg:#eef1ee;--ink:#1c2a2a;--mute:#5d6b6b;--card:#fff;--line:#c9d3cf;--accent:#0f766e;--on:#fff;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#121a1a;--ink:#e6efed;--mute:#93a4a1;--card:#1b2626;--line:#33423f;--accent:#2dd4bf;--on:#062321;--bad:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 18px;color:var(--mute)}
.banner{padding:10px 12px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.ok{color:var(--accent)}.bad{color:var(--bad)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;border:2px dashed var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:center}
.drop.over{border-color:var(--accent)}
.drop span{color:var(--mute);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px}
#pick{background:var(--card);color:var(--accent);border:1px solid var(--accent);font-weight:600}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.95rem}
#pass{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
#go{width:100%;margin-top:14px;background:var(--accent);color:var(--on);font-weight:700}
#go:disabled{opacity:.45;cursor:not-allowed}
#msg{min-height:1.5em;margin:12px 0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.top{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{color:var(--mute);text-align:right}
.bar{height:6px;margin-top:8px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
li.done .st{color:var(--accent)}li.fail .st{color:var(--bad)}li.fail .bar i{background:var(--bad)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;font-weight:600;cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{transform:translateX(20px)}
.tog input:disabled{opacity:.4;cursor:not-allowed}
.hint{margin:4px 0 0;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Send to Drive</h1>
  <p class="sub">Choose photos, videos, audio or any file, then press Upload.</p>

  <div id="banner" class="banner">Checking connection…</div>

  <div class="drop" id="drop">
    <button type="button" id="pick">Choose files</button>
    <span>or drop them here</span>
    <input type="file" id="file" multiple hidden>
  </div>

  <label for="pass">Passcode</label>
  <input id="pass" type="password" placeholder="Enter your upload passcode" autocomplete="off">

  <label class="tog"><span>Background upload</span><input type="checkbox" id="bg"></label>
  <p class="hint" id="bgnote">Keeps uploading after you close this tab. Chrome on Android only.</p>

  <label class="tog"><span>Anonymous</span><input type="checkbox" id="anon"></label>
  <p class="hint">Turns the page blank white when you press Upload. Triple-tap the screen to bring it back.</p>

  <button type="button" id="go" disabled>Upload</button>
  <p id="msg" role="status"></p>
  <ul id="list"></ul>
</main>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuEX0scPt70-IPL10b5euk6SKOoCHbyKwqoghrbM1c9mdbz2FlbN2xlbtr25QhPPxK/exec';

const $ = id => document.getElementById(id);
const banner = $('banner'), drop = $('drop'), input = $('file'), pass = $('pass'),
      go = $('go'), msg = $('msg'), list = $('list');
let items = [], busy = false;

const say = (t, k) => { msg.textContent = t; msg.className = k || ''; };
const note = (t, k) => { banner.textContent = t; banner.className = 'banner ' + (k || ''); };
const fmt = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

// Show any hidden script problem on the page instead of failing silently
window.addEventListener('error', e => note('Page error: ' + e.message, 'bad'));

// Remember the passcode on this device
try { pass.value = localStorage.getItem('pass') || ''; } catch (e) {}
pass.addEventListener('input', () => { try { localStorage.setItem('pass', pass.value); } catch (e) {} say(''); });

// Connection check
if (location.protocol === 'file:') {
  note('This page is open as a local file. Uploads need the hosted https address of your site.', 'bad');
} else {
  fetch(SCRIPT_URL).then(r => r.json()).then(j => {
    j.ok ? note('Connected. Ready to upload.', 'ok') : note('The uploader replied with an error.', 'bad');
  }).catch(() => note('Cannot reach the uploader. In Apps Script, deploy as Web app with access set to Anyone.', 'bad'));
}

// Choosing files
$('pick').addEventListener('click', e => { e.stopPropagation(); input.click(); });
drop.addEventListener('click', () => input.click());
input.addEventListener('change', () => { add(input.files); input.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => add(e.dataTransfer.files));

function add(files) {
  const picked = [...files];
  picked.forEach(file => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="top"><span class="name"></span><span class="st">Ready</span></div><div class="bar"><i></i></div>';
    li.querySelector('.name').textContent = file.name + ' (' + fmt(file.size) + ')';
    list.appendChild(li);
    items.push({ file, li, done: false });
  });
  if (picked.length) say(picked.length + (picked.length > 1 ? ' files' : ' file') + ' added. Enter the passcode and press Upload.');
  refresh();
}

function refresh() {
  const n = items.filter(i => !i.done).length;
  go.disabled = busy || !n;
  go.textContent = n ? 'Upload ' + n + (n > 1 ? ' files' : ' file') : 'Upload';
}

const row = (li, text) => { li.querySelector('.st').textContent = text; };

// Press Upload
go.addEventListener('click', async () => {
  if (!pass.value) { say('Enter your passcode first.', 'bad'); pass.focus(); return; }
  if (anonBox.checked) goBlank();
  if (bgBox.checked && bgOK) { await runBackground(); return; }
  busy = true; refresh();
  const todo = items.filter(i => !i.done);
  let ok = 0, auth = false;
  for (let k = 0; k < todo.length && !auth; k++) {
    say('Uploading ' + (k + 1) + ' of ' + todo.length + '. Keep this page open.');
    const r = await upload(todo[k]);
    if (r === true) ok++;
    if (r === 'auth') auth = true;
  }
  busy = false; refresh();
  if (auth) say('Wrong passcode. Check it and press Upload again.', 'bad');
  else if (ok === todo.length) say('Done. ' + ok + (ok > 1 ? ' files are' : ' file is') + ' in your Drive folder.', 'ok');
  else say(ok + ' uploaded, ' + (todo.length - ok) + ' failed. See the red items, then press Upload to retry.', 'bad');
});

async function upload(it) {
  const { file, li } = it;
  li.classList.remove('fail');
  li.querySelector('i').style.width = '0';
  try {
    row(li, 'Starting…');
    const type = file.type || 'application/octet-stream';
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ secret: pass.value, name: file.name, type, origin: location.protocol.startsWith('http') ? location.origin : '' })
    });
    let j;
    try { j = JSON.parse(await r.text()); }
    catch (e) { throw new Error('Uploader gave no valid answer. Redeploy the web app with access set to Anyone.'); }
    if (!j.ok) throw new Error(j.error || 'Rejected');

    await put(j.url, file, li);
    li.querySelector('i').style.width = '100%';
    row(li, 'Uploaded ✓'); li.classList.add('done'); it.done = true;
    return true;
  } catch (err) {
    row(li, err.message); li.classList.add('fail');
    return err.message === 'Wrong passcode' ? 'auth' : false;
  }
}

function put(url, file, li) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      li.querySelector('i').style.width = p + '%';
      row(li, 'Uploading ' + p + '%');
    };
    x.onload = () => x.status < 300 ? resolve() : reject(new Error('Drive error ' + x.status));
    x.onerror = () => reject(new Error('Upload blocked. Use the https address of your hosted site.'));
    x.send(file);
  });
}

// ---------- Background upload (separate feature, off by default) ----------
const bgBox = $('bg'), bgNote = $('bgnote');
const bgOK = 'serviceWorker' in navigator && 'BackgroundFetchManager' in self && location.protocol.startsWith('http');
if (bgOK) { try { bgBox.checked = localStorage.getItem('bg') === '1'; } catch (e) {} }
else { bgBox.disabled = true; bgNote.textContent = 'Not available here. It needs Chrome on Android, opened from your https site.'; }
bgBox.addEventListener('change', () => { try { localStorage.setItem('bg', bgBox.checked ? '1' : '0'); } catch (e) {} });

let bgListening = false;
function bgListen() {
  if (bgListening) return;
  bgListening = true;
  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    const it = items.find(i => i.key === m.key);
    if (!it) return;
    it.fin = true;
    if (m.ok) { it.li.querySelector('i').style.width = '100%'; row(it.li, 'Uploaded ✓'); it.li.classList.add('done'); }
    else { it.done = false; row(it.li, m.error || 'Upload failed'); it.li.classList.add('fail'); refresh(); }
  });
}

const BG_MAX = 25 * 1048576;   // bigger files use the normal upload
const BG_GROUP = 30 * 1048576; // files are bundled into Chrome jobs of about this size
let keyN = 0;

const toB64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.slice(r.result.indexOf(',') + 1));
  r.onerror = () => rej(new Error('Could not read file'));
  r.readAsDataURL(f);
});

async function runBackground() {
  busy = true; refresh();
  const todo = items.filter(i => !i.done);
  const big = todo.filter(i => i.file.size > BG_MAX);
  const groups = []; let cur = [], sum = 0;
  todo.filter(i => i.file.size <= BG_MAX).forEach(it => {
    if (cur.length && sum + it.file.size > BG_GROUP) { groups.push(cur); cur = []; sum = 0; }
    cur.push(it); sum += it.file.size;
  });
  if (cur.length) groups.push(cur);

  let queued = 0, refused = '', stop = '';
  try {
    say('Handing files to Chrome…');
    await navigator.serviceWorker.register('sw.js');
    const reg = await navigator.serviceWorker.ready;
    bgListen();
    for (const g of groups) {
      try {
        const reqs = [];
        for (const it of g) {
          row(it.li, 'Preparing…'); it.li.classList.remove('fail'); it.fin = false;
          it.key = 'k' + (++keyN);
          const body = await toB64(it.file);
          const url = SCRIPT_URL + '?direct=1&k=' + it.key + '&secret=' + encodeURIComponent(pass.value) +
            '&name=' + encodeURIComponent(it.file.name) + '&type=' + encodeURIComponent(it.file.type || 'application/octet-stream');
          reqs.push(new Request(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body }));
        }
        let bf;
        try {
          bf = await reg.backgroundFetch.fetch('up-' + Date.now() + '-' + keyN, reqs, { title: 'Uploading ' + g.length + (g.length > 1 ? ' files' : ' file') });
        } catch (e) {
          refused = e.name + ': ' + e.message;
          for (const it of g) await upload(it); // Chrome said no: normal upload, tab must stay open
          continue;
        }
        g.forEach(it => { it.done = true; row(it.li, 'Sent to Chrome'); });
        queued += g.length;
        bf.addEventListener('progress', () => {
          if (!bf.uploadTotal || bf.result === 'success') return;
          const p = Math.round(bf.uploaded / bf.uploadTotal * 100);
          g.forEach(it => { if (!it.fin) { it.li.querySelector('i').style.width = p + '%'; row(it.li, 'Uploading ' + p + '%'); } });
        });
      } catch (err) {
        g.forEach(it => { row(it.li, err.message); it.li.classList.add('fail'); });
      }
    }
    if (big.length) say('Large files upload the normal way. Keep this page open.');
    for (const it of big) await upload(it);
  } catch (err) {
    stop = 'Background mode could not start: ' + err.message;
  }
  busy = false; refresh();
  if (stop) say(stop, 'bad');
  else if (refused) say('Chrome refused background mode (' + refused + '). Those files were uploaded the normal way instead.', 'bad');
  else say((queued ? queued + (queued > 1 ? ' files are' : ' file is') + ' with Chrome now. You can close this tab. ' : '') +
           (big.length ? big.length + (big.length > 1 ? ' files' : ' file') + ' over 25 MB uploaded the normal way.' : ''), 'ok');
}

// ---------- Anonymous mode (separate feature, off by default, not remembered) ----------
const anonBox = $('anon');
let cover = null, taps = [], wake = null;
const pageTitle = document.title;

function goBlank() {
  if (cover) return;
  cover = document.createElement('div');
  cover.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:2147483647;touch-action:none';
  cover.addEventListener('click', () => {
    const now = Date.now();
    taps = taps.filter(t => now - t < 900).concat(now);
    if (taps.length >= 3) unBlank();
  });
  document.body.appendChild(cover);
  document.title = ' ';
  keepAwake();
}

function unBlank() {
  if (cover) cover.remove();
  cover = null; taps = [];
  document.title = pageTitle;
}

// Keep the screen on while files upload, so the phone does not pause the page
async function keepAwake() {
  try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  let seen = false, idle = 0;
  const t = setInterval(() => {
    if (busy) seen = true;
    if (busy || (!seen && ++idle < 30)) return;
    clearInterval(t);
    try { wake && wake.release(); } catch (e) {}
    wake = null;
  }, 1000);
}
</script>
</body>
</html>
